[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "leantrack"
version = "0.1.0"
description = "Multi-object tracking runtime that schedules detection against a compute budget."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Yash Bitla" }]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "opencv-python-headless>=4.10",
  "onnxruntime>=1.18",
]

[project.optional-dependencies]
ultralytics = ["ultralytics>=8.3"]
bench = ["trackeval==1.3.0", "boxmot>=25", "matplotlib>=3.9", "onnx>=1.16"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
leantrack = "leantrack.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/leantrack"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

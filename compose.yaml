# The stream service with Prometheus and Grafana.
#
#   SOURCE=/data/video.mp4 MODEL=/models/yolox_s.onnx docker compose up --build
#
# Put the video in ./data and the model in ./models. Grafana is at http://localhost:3000.
services:
  leantrack:
    build: .
    command:
      - serve
      - ${SOURCE:-/data/video.mp4}
      - --model
      - ${MODEL:-/models/yolox_s.onnx}
      - --background
      - --loop
      - --host
      - 0.0.0.0
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro
      - ./models:/models:ro

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

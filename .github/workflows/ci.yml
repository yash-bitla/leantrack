name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,serve]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src tests bench
      - run: pytest --cov=leantrack --cov-report=term-missing
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t leantrack .
      - run: docker run --rm leantrack --help
      - run: docker run --rm leantrack serve --help
      - run: docker run --rm --entrypoint python leantrack -c "import leantrack.serve.app"
      - run: docker compose config --quiet
